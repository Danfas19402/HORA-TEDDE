<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#168a45">
  <link rel="manifest" href="manifest.json">
  <title>HORA TEDDE</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
<header class="cabecalho">
  <div class="marca">
    <span class="icone-relogio" aria-hidden="true">
      <span class="ponteiro-hora"></span>
      <span class="ponteiro-minuto"></span>
    </span>
    <div>
      <h1>HORA TEDDE</h1>
      <h2>Controle de horas trabalhadas</h2>
    </div>
  </div>
  <button id="btnTema" class="btn-tema">🌙 Tema</button>
</header>

<main>
<section class="card formulario">
  <h2>➕ Adicionar dia</h2>
  <div class="campos">
    <label>Data<input type="date" id="data"></label>
    <label>Entrada<input type="time" id="entrada"></label>
    <label>Almoço início<input type="time" id="almocoInicio"></label>
    <label>Retorno almoço<input type="time" id="almocoFim"></label>
    <label>Saída<input type="time" id="saida"></label>
  </div>
  <div class="acoes">
    <button id="btnAdicionar">➕ Adicionar dia</button>
    <button id="btnFolga" class="btn-secundario">☕ Folga</button>
  </div>
</section>

<section class="card">
  <h2>📋 Registros</h2>
  <div class="tabela-container">
    <table>
      <thead><tr>
        <th>Data</th><th>Entrada</th><th>Almoço início</th><th>Retorno almoço</th>
        <th>Saída</th><th>Horas trabalhadas</th><th>Hora extra</th><th>Ação</th>
      </tr></thead>
      <tbody id="tabela"></tbody>
    </table>
  </div>
  <div class="acoes acoes-finais">
    <button id="btnExcel">📊 Exportar Excel</button>
    <button id="btnPdf">📄 Exportar PDF</button>
    <button id="btnImprimir" class="btn-imprimir">🖨️ Imprimir</button>
    <button id="btnLimpar" class="btn-perigo">🗑️ Limpar tudo</button>
  </div>
</section>

</main>
<footer>© 2026 HORA TEDDE - Todos os direitos reservados.</footer>
<p>© Desenvolvido por: Daniel Fealsi</p>

<script src="script.js"></script>
</body>

</html>
